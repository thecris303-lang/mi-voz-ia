
name: Compilar Mi Voz IA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extraer proyecto
        run: unzip -o mi-voz-ia.zip

      - name: Instalar y preparar
        working-directory: mi-voz-ia
        run: |
          npm install
          npm test
          npm run build:web
          npx cap sync android

      - name: Compilar APK
        working-directory: mi-voz-ia/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MiVozIA-APK
          path: mi-voz-ia/android/app/build/outputs/apk/debug/app-debug.apk
